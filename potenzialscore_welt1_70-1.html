    function fmtIntDE(x) {
      if (x === null || x === undefined || x === "") return "";
      const n = Number(x);
      if (!isFinite(n)) return x;
      return new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(n);
    }

    function fmtDecDE(x, decimals=2) {
      if (x === null || x === undefined || x === "") return "";
      const n = Number(x);
      if (!isFinite(n)) return x;
      return new Intl.NumberFormat('de-DE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);
    }

    function fmtPctDE(x) {
      if (x === null || x === undefined || x === "") return "";
      const n = Number(x);
      if (!isFinite(n)) return x;
      return fmtDecDE(n, 2) + " %";
    }

    $(document).ready(function() {
      const table = $('#tbl').DataTable({
        data: DATA,
        scrollX: true,
        fixedHeader: true,
        order: [[8, 'desc']], // MW-Trend %
        columnDefs: [
          { targets: 0, orderable: false, searchable: false },
          // Stärke Ø
          { targets: 3, render: function(data, type) {
              if (type === 'display') return fmtDecDE(data, 2);
              return data;
          } },
          // Marktwert (int)
          { targets: 4, render: function(data, type) {
              if (type === 'display') return fmtIntDE(data);
              return data;
          } },
          // Stärke-Trend Ø
          { targets: 5, render: function(data, type) {
              if (type === 'display') return fmtDecDE(data, 2);
              return data;
          } },
          // Stärke-Trend %
          { targets: 6, render: function(data, type) {
              if (type === 'display') return fmtPctDE(data);
              return data;
          } },
          // MW-Trend Summe (int)
          { targets: 7, render: function(data, type) {
              if (type === 'display') return fmtIntDE(data);
              return data;
          } },
          // MW-Trend %
          { targets: 8, render: function(data, type) {
              if (type === 'display') return fmtPctDE(data);
              return data;
          } },
        ],
        initComplete: function() {
          const api = this.api();
          // Filter only for Land (column index 2)

          const select = $('<select><option value="">Alle</option></select>')
            .appendTo(wrapper)
            .on('change', function() {
              col.search(this.value).draw();

          col.data().unique().sort().each(function(d) {
            if (d !== null && d !== undefined && String(d).trim() !== "") {
              select.append('<option value="'+d+'">'+d+'</option>');
            }
          });

        drawCallback: function() {
          const api = this.api();
          api.column(0, { page: 'current' }).nodes().each(function(cell, i) {
            cell.innerHTML = i + 1;
          });
        }
      });
