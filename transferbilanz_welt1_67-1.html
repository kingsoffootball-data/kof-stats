          const table = $('#transferTabelle').DataTable({
            data: tableData,
            columns: tableColumns,
            order: [[5, 'desc']],
            columnDefs: [
              {
                targets: 0,
                searchable: false,
                orderable: false
              }
            ],
            drawCallback: function(settings) {
              const api = this.api();
              api.column(0, { page: 'current' }).nodes().each(function(cell, i) {
                cell.innerHTML = i + 1;
              });
            },
            initComplete: function () {
              this.api().columns().every(function () {
                const colTitle = this.header().textContent;
                if (colTitle === 'Land') {
                  createDropdown(this, landOptions);
                }
              });
            }
          });
        });
      </script>
    </body>
    </html>
