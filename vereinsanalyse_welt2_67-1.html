    function fmtIntDE(x) {
      if (x === null || x === undefined || x === "") return "";
      const n = Number(x);
      if (!isFinite(n)) return x;
      return new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(n);
    }

    function fmtDecDE(x, decimals=2) {
      if (x === null || x === undefined || x === "") return "";
      const n = Number(x);
      if (!isFinite(n)) return x;
      return new Intl.NumberFormat('de-DE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);
    }

    $(document).ready(function() {
      const table = $('#tbl').DataTable({
        data: DATA,
        scrollX: true,
        fixedHeader: true,
        order: [[5, 'desc']],
        columnDefs: [
          { targets: 0, orderable: false, searchable: false },
          // numeric formatting for display, keep raw for sort/search
          { targets: [5,6,7,8,9,10], render: function(data, type) {
              if (type === 'display') return fmtDecDE(data, 2);
              return data;
          } },
          { targets: 11, render: function(data, type) {
              if (type === 'display') return fmtIntDE(data);
              return data;
          } },
          { targets: 12, render: function(data, type) {
              if (type === 'display') return fmtIntDE(data);
              return data;
          } },
          { targets: 13, render: function(data, type) {
              if (type === 'display') return fmtDecDE(data, 2);
              return data;
          } }
        ],
        initComplete: function() {
          const api = this.api();
          const filterCols = {
            "Verband": 1,
            "Land": 2,
            "Liga": 3,
            "Status/Manager": 14
          };

          function setHeaderWithSelect(colIdx, titleText, customOrder) {
            const col = api.column(colIdx);
            const th = $(col.header());
            th.empty();
            th.append('<div class="th-title">'+titleText+'</div>');
            const wrapper = $('<div class="th-filter"></div>').appendTo(th);
            const select = $('<select><option value="">Alle</option></select>')
              .appendTo(wrapper)
              .on('change', function() {
                col.search(this.value).draw();
              });

            let vals = col.data().toArray().filter(v => v !== null && v !== undefined && String(v).trim() !== "");
            vals = Array.from(new Set(vals.map(v => String(v))));
            if (customOrder) {
              // customOrder: array at top, rest alphabetical
              const top = customOrder.filter(v => vals.includes(v));
              const rest = vals.filter(v => !customOrder.includes(v)).sort((a,b)=>a.localeCompare(b,'de'));
              vals = top.concat(rest);
            } else {
              vals = vals.sort((a,b)=>a.localeCompare(b,'de'));
            }
            vals.forEach(v => select.append('<option value="'+v+'">'+v+'</option>'));
          }

          setHeaderWithSelect(filterCols["Verband"], "Verband");
          setHeaderWithSelect(filterCols["Land"], "Land");
          setHeaderWithSelect(filterCols["Liga"], "Liga");
          setHeaderWithSelect(filterCols["Status/Manager"], "Status/Manager", ["frei","vergabe","verschuldet"]);
        },
        drawCallback: function() {
          const api = this.api();
          api.column(0, { page: 'current' }).nodes().each(function(cell, i) {
            cell.innerHTML = i + 1;
          });
        }
      });
    });
  </script>
