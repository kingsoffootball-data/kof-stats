$(document).ready(function() {
  let table = $('#table').DataTable({
    data: DATA.data,
    columns: DATA.columns,
    order: [[3, 'desc']], 
    scrollX: true,
    fixedHeader: true,
    columnDefs: [
        { targets: 0, orderable: false, searchable: false }
    ],
    initComplete: function() {
      let api = this.api();
      api.columns().every(function() {
        let col = this;
        let title = col.header().textContent.trim();
        if (title === "Land") {
          let select = document.createElement("select");
          select.innerHTML = '<option value="">Alle</option>';
          let unique = [...new Set(col.data().toArray())].sort();
          unique.forEach(v => {
            let opt = document.createElement("option");
            opt.value = v; 
            opt.textContent = v;
            select.appendChild(opt);
          });
          $(col.header()).html(select);
          select.addEventListener("change", () => col.search(select.value).draw());
        }
      });
    },
    drawCallback: function() {
      this.api().column(0, { page: 'current' }).nodes().each((cell, i) => cell.innerHTML = i + 1);
    }
  });
});
