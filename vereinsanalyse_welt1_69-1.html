    function createDropdown(column, options) {
      const select = $('<select><option value="">Alle</option></select>')
        .appendTo($(column.header()).empty())
        .on('change', function () {
          column.search(this.value).draw();
        });
      options.forEach(val => {
        select.append('<option value="' + val + '">' + val + '</option>');
      });
    }

    $(document).ready(function () {
      const table = $('#vereinsTabelle').DataTable({
        data: tableData,
        columns: tableColumns,
        order: [[5, 'desc']],
        columnDefs: [
          {
            targets: 0,
            searchable: false,
            orderable: false
          }
        ],
        drawCallback: function(settings) {
          const api = this.api();
          api.column(0, { page: 'current' }).nodes().each(function(cell, i) {
            cell.innerHTML = i + 1;
          });
        },
        initComplete: function () {
          this.api().columns().every(function () {
            const colTitle = this.header().textContent;
            if (filterOptions[colTitle]) {
              createDropdown(this, filterOptions[colTitle]);
            }
          });
        }
      });
    });
